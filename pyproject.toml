[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shopify-graphql-handler"
version = "0.1.0"
description = "Production‑grade Python SDK for Shopify GraphQL Admin API abstraction"
authors = [{name = "Nitin Santosh Mahale", email = "nsmahalead@gmail.com"}]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["shopify", "graphql", "api", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Natural Language :: English",
]
dependencies = [
    "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/nitin-mahale/shopify-graphql-handler"
Repository = "https://github.com/nitin-mahale/shopify-graphql-handler.git"
Documentation = "https://github.com/nitin-mahale/shopify-graphql-handler#readme"
"Bug Tracker" = "https://github.com/nitin-mahale/shopify-graphql-handler/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "requests-mock>=1.11",
    "black",
]

[tool.setuptools]
packages = ["shopify_graphql_handler"]
